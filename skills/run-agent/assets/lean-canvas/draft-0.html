<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft 0</title>
<!--
  תבנית התצוגה של Draft 0 — מצע לדיון לקוביות 1, 2, 5. הסוכן ממלא רק את בלוק הנתונים (id="data") מה-MD המאושר.
  proposals: { "text", "source" } — source ריק = הנחה   ·   status: "✓" | "~" | "?" | "⚡" | ""   ·   discuss: עד 2
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7; --paper: #ffffff; --ink: #1c2430; --muted: #5d6878; --line: #d5dae2;
    --accent: #6b3fa0; --accent-soft: #f1ebf8; --discuss: #fff8e1; --discuss-line: #f0d48a;
    --ok: #1e7a45; --ok-bg: #e3f4ea; --assume: #8a5a00; --assume-bg: #fdf1d6;
    --gap: #475569; --gap-bg: #e7ebf0; --conflict: #b42318; --conflict-bg: #fde4e1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Assistant", "Heebo", "Arial Hebrew", Arial, sans-serif; font-size: clamp(14px, 1vw, 22px); line-height: 1.45; padding: 1.3em 1.4em; overflow-x: hidden; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1em; flex-wrap: wrap; margin-bottom: 1em; }
  h1 { margin: 0; font-size: 1.9em; font-weight: 800; }
  h1 .tag { font-weight: 600; color: var(--muted); }
  .ribbon { background: var(--accent); color: #fff; font-weight: 800; padding: 0.35em 1em; border-radius: 999px; }
  .sub { color: var(--muted); margin-top: 0.2em; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1em; }
  .card { background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 10px; padding: 1em 1.1em; display: flex; flex-direction: column; gap: 0.7em; min-width: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5em; }
  .card-title { display: flex; align-items: center; gap: 0.5em; font-weight: 800; font-size: 1.25em; }
  .num { width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: 800; flex: none; }
  .badge { white-space: nowrap; font-weight: 700; font-size: 0.8em; padding: 0.12em 0.6em; border-radius: 999px; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); } .badge.assume { color: var(--assume); background: var(--assume-bg); }
  .badge.gap { color: var(--gap); background: var(--gap-bg); } .badge.conflict { color: var(--conflict); background: var(--conflict-bg); }
  .badge.none { color: var(--muted); border: 1px dashed var(--line); }
  h3 { margin: 0 0 0.25em; font-size: 0.95em; color: var(--accent); font-weight: 700; }
  ul, ol { margin: 0; padding-inline-start: 1.2em; } li { margin: 0.3em 0; overflow-wrap: anywhere; }
  .src { display: block; color: var(--muted); font-size: 0.82em; }
  .src.assume { color: var(--assume); }
  .why { color: var(--muted); font-size: 0.9em; }
  .discuss { background: var(--discuss); border: 1px solid var(--discuss-line); border-radius: 8px; padding: 0.6em 0.8em; }
  .gaps { border-top: 1px solid var(--line); padding-top: 0.5em; font-size: 0.92em; }
  .empty { color: var(--muted); font-style: italic; }
  @media (max-width: 1000px) { .cards { grid-template-columns: 1fr; } }
  @media print { @page { size: A4 landscape; margin: 10mm; } body { background: #fff; font-size: 9.5pt; padding: 0; } .card { break-inside: avoid; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Draft 0 <span class="tag" id="venture"></span></h1>
    <div class="sub" id="meta"></div>
  </div>
  <div class="ribbon">מצע לדיון — לא החלטה</div>
</header>
<main class="cards" id="cards"></main>

<script type="application/json" id="data">
{
  "venture": "[שם המיזם]",
  "date": "[תאריך]",
  "cubes": {
    "1": { "proposals": [ { "text": "", "source": "" } ], "sub": [ { "text": "", "source": "" } ], "status": "", "why": "", "discuss": [], "gaps": [] },
    "2": { "proposals": [ { "text": "", "source": "" } ], "sub": [ { "text": "", "source": "" } ], "status": "", "why": "", "discuss": [], "gaps": [] },
    "5": { "proposals": [ { "text": "", "source": "" } ], "sub": [ { "text": "", "source": "" } ], "status": "", "why": "", "discuss": [], "gaps": [] }
  }
}
</script>
<script>
  const CUBES = {
    1: { title: "הלקוחות", main: "הצעה", sub: "Early Adopters" },
    2: { title: "הבעיות", main: "הצעה (3–5)", sub: "אלטרנטיבות קיימות", ordered: true },
    5: { title: "הצעת ערך ייחודית", main: "הצעה (משפט אחד)", sub: "High Level Concept" }
  };
  const STATUS = { "✓": ["ok", "סטטוס מוצע: ✓ מבוסס"], "~": ["assume", "סטטוס מוצע: ~ הנחה"], "?": ["gap", "סטטוס מוצע: ? פער"], "⚡": ["conflict", "סטטוס מוצע: ⚡ סתירה"], "": ["none", "סטטוס: —"] };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const items = (arr, ordered) => {
    arr = (arr || []).filter(p => p && p.text);
    if (!arr.length) return el("div", "empty", "—");
    const l = el(ordered ? "ol" : "ul");
    arr.forEach(p => { const li = el("li", null, p.text); li.append(el("span", p.source ? "src" : "src assume", p.source ? "מקור: " + p.source : "הנחה — אין מקור")); l.append(li); });
    return l;
  };
  const plain = (arr) => { arr = (arr || []).filter(Boolean); if (!arr.length) return el("div", "empty", "—"); const ul = el("ul"); arr.forEach(t => ul.append(el("li", null, t))); return ul; };
  const d = JSON.parse(document.getElementById("data").textContent);
  document.title = "Draft 0 — " + d.venture;
  document.getElementById("venture").textContent = "— " + d.venture;
  document.getElementById("meta").textContent = d.date + " · קוביות 1, 2, 5";
  const cards = document.getElementById("cards");
  Object.keys(CUBES).forEach(n => {
    const def = CUBES[n], c = (d.cubes && d.cubes[n]) || {};
    const card = el("section", "card"), head = el("div", "card-head"), t = el("div", "card-title");
    t.append(el("span", "num", n), el("span", null, def.title));
    const s = STATUS[c.status || ""] || STATUS[""];
    head.append(t, el("span", "badge " + s[0], s[1]));
    card.append(head);
    const main = el("div"); main.append(el("h3", null, def.main), items(c.proposals, def.ordered)); card.append(main);
    const sub = el("div"); sub.append(el("h3", null, def.sub), items(c.sub)); card.append(sub);
    if (c.why) card.append(el("div", "why", "למה הסטטוס הזה: " + c.why));
    const disc = el("div", "discuss"); disc.append(el("h3", null, "לדיון"), plain(c.discuss)); card.append(disc);
    const g = el("div", "gaps"); g.append(el("h3", null, "פערים וסתירות"), plain(c.gaps)); card.append(g);
    cards.append(card);
  });
</script>
</body>
</html>
