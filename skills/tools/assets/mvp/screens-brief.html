<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>בריף מסכים</title>
<!--
  תבנית בריף המסכים — נשמר במיזם כ-בריף-מסכים.html, ליד בריף-מסכים.md, ונגזר ממנו. Draft 0 בצהריים, סופי בסוף היום.
  הסוכן ממלא רק את בלוק הנתונים (id="data"). העיצוב קבוע. Light theme בלבד. wireframe בנאמנות נמוכה: בלי צבע ובלי סגנון.
  status: "Draft 0" / "סופי"   ·   question: שאלת ה-MVP (רשות)   ·   studio: קישור לתוצר של הסטודיו (בסופי, רשות)
  actors: id (אות — A, B), name, device ("נייד" / "מחשב")
  steps: n, text (שלב בתרחיש, מתוך מפרט ה-MVP), screens (קודי מסכים)
  screens: code (A1), name, actor, device, step, lead (true למסך מוביל — רשות), essence (מהות), does (מה המשתמש עושה),
           actions: [{ label, to (קוד מסך, רשות), result (מה קורה, רשות) }], components: [{ name, value, notSelected (true — "[לא נבחר]") }],
           changed (מה השתנה בסבב — בסופי), wireframe: אבני בניין, מלמעלה למטה:
             { "t": "bar", "text" } סרגל עליון · { "t": "title", "text" } · { "t": "text", "text" } או { "t": "text", "lines": 2 }
             { "t": "card", "tag", "title", "text", "lines", "solid": true } · { "t": "chips", "items": [] } · { "t": "button", "text", "secondary": true }
             { "t": "input", "text" } · { "t": "list", "items": [] } · { "t": "bubble", "side": "in" / "out", "text", "lines", "label" }
             { "t": "note", "text" } הערה על המסך · { "t": "spacer" } דוחף את מה שאחריו לתחתית · { "t": "split", "side": [...], "main": [...] } — מחשב, שני טורים
  open: מסכים או רכיבים שעלו ולא הוחלטו
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7; --paper: #ffffff; --ink: #1c2430; --muted: #5d6878; --line: #d5dae2;
    --navy: #1b2a4a; --navy-soft: #e8ecf3; --lead: #8a5a00; --lead-bg: #fdf1d6; --warn: #b42318; --warn-bg: #fdecea;
    --wf-bg: #f7f7f5; --wf-line: #a9aeb5; --wf-fill: #e4e6e9; --wf-dark: #8d939b; --wf-ink: #4a525c;
    --a1: #1f5f8b; --a2: #7a3f96; --a3: #a8551f; --a4: #2c7448;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); color-scheme: light; }
  body { font-family: "Assistant", "Heebo", "Arial Hebrew", Arial, sans-serif; font-size: clamp(14px, 0.9vw, 20px); line-height: 1.45; padding: 1.2em 1.4em 3em; overflow-x: hidden; }
  a { color: inherit; }
  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.85em; font-weight: 800; }
  h1 .tag { font-weight: 600; color: var(--muted); }
  .sub { color: var(--muted); margin-top: 0.15em; }
  .ribbon { background: var(--navy); color: #fff; font-weight: 800; padding: 0.35em 1em; border-radius: 999px; white-space: nowrap; }
  .ribbon.draft { background: var(--lead-bg); color: var(--lead); border: 1px solid #f0d48a; }
  .question { margin: 0.9em 0 0; background: var(--paper); border: 1px solid var(--line); border-inline-start: 6px solid var(--navy); border-radius: 10px; padding: 0.6em 1em; }
  .question .lbl { font-size: 0.82em; font-weight: 700; color: var(--muted); }
  .question .q { font-size: 1.12em; font-weight: 800; overflow-wrap: anywhere; }
  h2 { font-size: 1.3em; margin: 1.4em 0 0.6em; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 0.9em 1.1em; }
  .lanes { display: flex; flex-direction: column; gap: 0.6em; }
  .lane { display: grid; grid-template-columns: 11em minmax(0, 1fr); gap: 0.8em; align-items: center; }
  .lane-lbl { font-weight: 800; color: var(--c); border-inline-start: 4px solid var(--c); padding-inline-start: 0.5em; }
  .lane-lbl span { display: block; font-weight: 600; color: var(--muted); font-size: 0.85em; }
  .seq { display: flex; align-items: center; gap: 0.35em; flex-wrap: wrap; }
  .node { text-decoration: none; background: color-mix(in srgb, var(--c) 10%, #fff); border: 1.5px solid color-mix(in srgb, var(--c) 45%, #fff); color: var(--ink); border-radius: 8px; padding: 0.2em 0.6em; font-weight: 700; white-space: nowrap; }
  .node b { color: var(--c); margin-inline-end: 0.3em; }
  .node.lead { box-shadow: 0 0 0 2px var(--lead) inset; }
  .arrow { color: var(--muted); font-weight: 800; }
  table.steps { width: 100%; border-collapse: collapse; margin-top: 0.9em; }
  table.steps th, table.steps td { text-align: start; padding: 0.4em 0.5em; border-top: 1px solid var(--line); vertical-align: top; }
  table.steps th { color: var(--muted); font-size: 0.85em; font-weight: 700; border-top: none; }
  table.steps td.n { font-weight: 800; width: 2.5em; }
  .codes { display: flex; gap: 0.3em; flex-wrap: wrap; }
  .codes a { text-decoration: none; font-weight: 800; background: var(--navy-soft); color: var(--navy); border-radius: 6px; padding: 0 0.45em; }
  .screens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1em; }
  .screen { --c: var(--navy); background: var(--paper); border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 12px; padding: 0.9em 1em; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head head" "info wf"; gap: 0.7em 1.1em; align-content: start; min-width: 0; scroll-margin-top: 1em; }
  .screen.desk { grid-template-areas: "head head" "info info" "wf wf"; }
  .screen > header { grid-area: head; display: flex; align-items: center; gap: 0.5em; flex-wrap: wrap; }
  .code { background: var(--c); color: #fff; font-weight: 800; border-radius: 6px; padding: 0.05em 0.5em; }
  .screen h3 { margin: 0; font-size: 1.15em; font-weight: 800; }
  .pill { font-size: 0.8em; font-weight: 700; background: var(--navy-soft); color: var(--navy); border-radius: 999px; padding: 0.05em 0.6em; white-space: nowrap; }
  .pill.lead { background: var(--lead-bg); color: var(--lead); }
  .info { grid-area: info; display: flex; flex-direction: column; gap: 0.5em; min-width: 0; }
  .fact h4 { margin: 0; font-size: 0.82em; color: var(--muted); font-weight: 700; }
  .fact div, .fact li { overflow-wrap: anywhere; }
  .fact ul { margin: 0.1em 0 0; padding-inline-start: 1.1em; } .fact li { margin: 0.15em 0; }
  .fact li a { font-weight: 800; }
  .comp { display: inline-block; font-size: 0.88em; font-weight: 700; background: var(--navy-soft); color: var(--navy); border-radius: 6px; padding: 0.05em 0.5em; margin: 0.15em 0 0 0.25em; }
  .comp .v { font-weight: 600; color: var(--muted); }
  .comp.ns { background: var(--warn-bg); color: var(--warn); }
  .changed { background: var(--lead-bg); border-radius: 8px; padding: 0.4em 0.7em; }
  .wf-wrap { grid-area: wf; display: flex; flex-direction: column; align-items: center; gap: 0.3em; }
  .wf-cap { font-size: 0.78em; color: var(--muted); }
  .wf { background: var(--wf-bg); border: 2px solid var(--wf-line); color: var(--wf-ink); font-size: 0.78em; line-height: 1.35; display: flex; flex-direction: column; gap: 0.45em; padding: 0.6em; overflow: hidden; }
  .wf.phone { width: 15.5em; min-height: 27em; border-radius: 1.6em; padding-top: 1.1em; }
  .wf.desk { width: 100%; max-width: 40em; min-height: 18em; border-radius: 0.6em; }
  .wf-bar { display: flex; justify-content: space-between; gap: 0.5em; font-weight: 700; border-bottom: 1.5px solid var(--wf-line); padding-bottom: 0.35em; }
  .wf-title { font-weight: 800; color: var(--ink); }
  .wf-text { overflow-wrap: anywhere; }
  .wf-ln { height: 0.55em; border-radius: 3px; background: var(--wf-fill); }
  .wf-card { border: 1.5px dashed var(--wf-line); border-radius: 0.5em; padding: 0.45em; display: flex; flex-direction: column; gap: 0.35em; }
  .wf-card.solid { border-style: solid; background: #fff; }
  .wf-tag { align-self: flex-start; font-size: 0.85em; font-weight: 700; border: 1px solid var(--wf-dark); border-radius: 999px; padding: 0 0.5em; }
  .wf-chips { display: flex; gap: 0.3em; flex-wrap: wrap; }
  .wf-chips span { border: 1.5px solid var(--wf-dark); border-radius: 999px; padding: 0.05em 0.55em; background: #fff; }
  .wf-btn { text-align: center; font-weight: 800; background: var(--wf-dark); color: #fff; border-radius: 0.4em; padding: 0.35em; }
  .wf-btn.sec { background: #fff; color: var(--wf-ink); border: 1.5px solid var(--wf-dark); }
  .wf-input { display: flex; justify-content: space-between; border: 1.5px solid var(--wf-line); border-radius: 0.5em; background: #fff; padding: 0.35em 0.5em; color: var(--muted); }
  .wf-list { display: flex; flex-direction: column; }
  .wf-list span { border-bottom: 1px solid var(--wf-fill); padding: 0.25em 0; overflow-wrap: anywhere; }
  .wf-bub { max-width: 85%; border-radius: 0.8em; padding: 0.4em 0.55em; display: flex; flex-direction: column; gap: 0.3em; overflow-wrap: anywhere; }
  .wf-bub.in { align-self: flex-start; background: #fff; border: 1.5px solid var(--wf-line); }
  .wf-bub.out { align-self: flex-end; background: var(--wf-fill); }
  .wf-bub small { color: var(--muted); font-size: 0.85em; }
  .wf-note { font-style: italic; color: var(--muted); text-align: center; }
  .wf-spacer { margin-top: auto; }
  .wf-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 0.6em; flex: 1; }
  .wf-split > div { display: flex; flex-direction: column; gap: 0.45em; min-width: 0; }
  .wf-split > div:first-child { border-inline-end: 1.5px solid var(--wf-line); padding-inline-end: 0.6em; }
  .empty { color: var(--muted); font-style: italic; }
  ul.open { margin: 0; padding-inline-start: 1.2em; } ul.open li { margin: 0.3em 0; overflow-wrap: anywhere; }
  @media (max-width: 1100px) { .screens { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { body { padding-inline: 1em; } .screen { grid-template-columns: 1fr; grid-template-areas: "head" "info" "wf"; } .lane { grid-template-columns: 1fr; } }
  @media print { @page { size: A4 landscape; margin: 10mm; } body { background: #fff; } .screen { break-inside: avoid; } }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>בריף מסכים <span class="tag" id="venture"></span></h1>
    <div class="sub" id="meta"></div>
  </div>
  <div class="ribbon" id="ribbon"></div>
</header>
<div class="question" id="qbox"><div class="lbl">שאלת ה-MVP</div><div class="q" id="question"></div></div>

<h2>מפת הזרימה</h2>
<section class="panel"><div class="lanes" id="lanes"></div><table class="steps" id="steps"></table></section>

<h2>המסכים</h2>
<main class="screens" id="screens"></main>

<section id="opensec" hidden>
  <h2>מה לא בבריף</h2>
  <div class="panel"><ul class="open" id="open"></ul></div>
</section>

<script type="application/json" id="data">
{
  "venture": "[שם המיזם]",
  "date": "[תאריך]",
  "status": "Draft 0",
  "question": "",
  "studio": "",
  "actors": [
    { "id": "A", "name": "[השחקן הראשי]", "device": "נייד" }
  ],
  "steps": [
    { "n": 1, "text": "[שלב בתרחיש]", "screens": ["A1"] }
  ],
  "screens": [
    { "code": "A1", "name": "[שם המסך]", "actor": "A", "device": "נייד", "step": 1, "lead": false,
      "essence": "[בשביל מה המסך קיים]", "does": "[מה המשתמש עושה]",
      "actions": [ { "label": "[פעולה]", "to": "", "result": "[מה קורה]" } ],
      "components": [ { "name": "[רכיב]", "value": "[ערך]" } ],
      "changed": "",
      "wireframe": [ { "t": "bar", "text": "[כותרת]" }, { "t": "card", "title": "[כותרת הכרטיס]", "lines": 3 }, { "t": "spacer" }, { "t": "button", "text": "[פעולה]" } ] }
  ],
  "open": []
}
</script>
<script>
(function () {
  var LANE = ["var(--a1)", "var(--a2)", "var(--a3)", "var(--a4)"];
  var WIDTHS = ["100%", "86%", "64%", "92%", "72%"];
  var d = JSON.parse(document.getElementById("data").textContent);
  var actors = (d.actors || []).filter(function (a) { return a && a.id; });
  var aIndex = {}; actors.forEach(function (a, i) { aIndex[a.id] = i; });
  var screens = (d.screens || []).filter(function (s) { return s && s.code; });
  var sByCode = {}; screens.forEach(function (s) { sByCode[s.code] = s; });
  var isFinal = d.status && d.status !== "Draft 0";

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function color(actor) { return actor in aIndex ? LANE[aIndex[actor] % LANE.length] : "var(--navy)"; }
  function link(code) { var a = el("a", null, code); a.href = "#" + code; return a; }

  document.title = "בריף מסכים — " + (d.venture || "");
  document.getElementById("venture").textContent = d.venture ? "— " + d.venture : "";
  var meta = [d.date, screens.length + " מסכים", actors.map(function (a) { return a.name; }).join(" · ")].filter(Boolean);
  document.getElementById("meta").textContent = meta.join(" · ");
  if (d.studio) { var m = document.getElementById("meta"); m.append(" · התוצר של הסטודיו: "); var sa = el("a", null, "קישור"); sa.href = d.studio; sa.target = "_blank"; sa.rel = "noopener"; m.append(sa); }
  var rib = document.getElementById("ribbon");
  rib.textContent = isFinal ? "בריף סופי" : "Draft 0 — מצע לדיון, לא החלטה";
  if (!isFinal) rib.classList.add("draft");
  if (d.question) document.getElementById("question").textContent = d.question; else document.getElementById("qbox").hidden = true;

  var lanes = document.getElementById("lanes");
  actors.forEach(function (a) {
    var mine = screens.filter(function (s) { return s.actor === a.id; }).sort(function (x, y) { return (x.step || 0) - (y.step || 0); });
    var lane = el("div", "lane"); lane.style.setProperty("--c", color(a.id));
    var lbl = el("div", "lane-lbl", a.id + " · " + a.name); lbl.append(el("span", null, a.device || ""));
    var seq = el("div", "seq");
    mine.forEach(function (s, i) {
      if (i) seq.append(el("span", "arrow", "←"));
      var n = el("a", "node" + (s.lead ? " lead" : "")); n.href = "#" + s.code;
      n.append(el("b", null, s.code), document.createTextNode(s.name || ""));
      seq.append(n);
    });
    if (!mine.length) seq.append(el("span", "empty", "—"));
    lane.append(lbl, seq); lanes.append(lane);
  });
  var steps = (d.steps || []).filter(function (s) { return s && s.text; });
  var tb = document.getElementById("steps");
  if (steps.length) {
    var hr = el("tr"); hr.append(el("th", null, "#"), el("th", null, "שלב בתרחיש"), el("th", null, "מסכים")); tb.append(hr);
    steps.forEach(function (s) {
      var tr = el("tr"), c = el("div", "codes");
      (s.screens || []).forEach(function (code) { c.append(link(code)); });
      var td = el("td"); td.append(c);
      tr.append(el("td", "n", String(s.n)), el("td", null, s.text), td); tb.append(tr);
    });
  } else tb.hidden = true;

  function lines(n, box) { for (var i = 0; i < (n || 2); i++) { var l = el("div", "wf-ln"); l.style.width = WIDTHS[i % WIDTHS.length]; box.append(l); } }
  function blocks(list, box) {
    (list || []).forEach(function (b) {
      if (!b || !b.t) return;
      var e;
      switch (b.t) {
        case "bar": e = el("div", "wf-bar"); e.append(el("span", null, b.text || ""), el("span", null, "☰")); break;
        case "title": e = el("div", "wf-title", b.text || ""); break;
        case "text": if (b.text) e = el("div", "wf-text", b.text); else { e = el("div"); e.style.display = "flex"; e.style.flexDirection = "column"; e.style.gap = "0.3em"; lines(b.lines, e); } break;
        case "card":
          e = el("div", "wf-card" + (b.solid ? " solid" : ""));
          if (b.tag) e.append(el("span", "wf-tag", b.tag));
          if (b.title) e.append(el("div", "wf-title", b.title));
          if (b.text) e.append(el("div", "wf-text", b.text));
          if (b.lines) lines(b.lines, e);
          break;
        case "chips": e = el("div", "wf-chips"); (b.items || []).forEach(function (t) { e.append(el("span", null, t)); }); break;
        case "button": e = el("div", "wf-btn" + (b.secondary ? " sec" : ""), b.text || ""); break;
        case "input": e = el("div", "wf-input"); e.append(el("span", null, b.text || ""), el("span", null, "➤")); break;
        case "list": e = el("div", "wf-list"); (b.items || []).forEach(function (t) { e.append(el("span", null, t)); }); break;
        case "bubble":
          e = el("div", "wf-bub " + (b.side === "out" ? "out" : "in"));
          if (b.text) e.append(el("div", null, b.text));
          if (b.lines) lines(b.lines, e);
          if (b.label) e.append(el("small", null, b.label));
          break;
        case "note": e = el("div", "wf-note", b.text || ""); break;
        case "spacer": e = el("div", "wf-spacer"); break;
        case "split":
          e = el("div", "wf-split"); var side = el("div"), main = el("div");
          blocks(b.side, side); blocks(b.main, main); e.append(side, main);
          break;
        default: return;
      }
      box.append(e);
    });
  }
  function fact(title, node) { var f = el("div", "fact"); f.append(el("h4", null, title)); f.append(node); return f; }

  var grid = document.getElementById("screens");
  if (!screens.length) grid.append(el("div", "empty", "אין עדיין מסכים"));
  screens.forEach(function (s) {
    var desk = (s.device || "") === "מחשב";
    var card = el("article", "screen" + (desk ? " desk" : "")); card.id = s.code; card.style.setProperty("--c", color(s.actor));
    var h = el("header");
    h.append(el("span", "code", s.code), el("h3", null, s.name || ""));
    var actor = actors[aIndex[s.actor]];
    h.append(el("span", "pill", (actor ? actor.name : s.actor || "") + " · " + (s.device || "")));
    if (s.step != null) h.append(el("span", "pill", "שלב " + s.step));
    if (s.lead) h.append(el("span", "pill lead", "מסך מוביל"));
    card.append(h);
    var info = el("div", "info");
    if (s.essence) info.append(fact("מהות", el("div", null, s.essence)));
    if (s.does) info.append(fact("מה המשתמש עושה", el("div", null, s.does)));
    var acts = (s.actions || []).filter(function (a) { return a && a.label; });
    if (acts.length) {
      var ul = el("ul");
      acts.forEach(function (a) {
        var li = el("li"); li.append(el("b", null, a.label));
        if (a.to && sByCode[a.to]) { li.append(document.createTextNode(" ← ")); li.append(link(a.to)); }
        else if (a.to) li.append(document.createTextNode(" ← " + a.to));
        if (a.result) li.append(document.createTextNode(" · " + a.result));
        ul.append(li);
      });
      info.append(fact("פעולות", ul));
    }
    var comps = (s.components || []).filter(function (c) { return c && c.name; });
    if (comps.length) {
      var box = el("div");
      comps.forEach(function (c) {
        var sp = el("span", "comp" + (c.notSelected ? " ns" : ""), c.name);
        if (c.value) sp.append(el("span", "v", " · " + c.value));
        if (c.notSelected) sp.append(document.createTextNode(" · [לא נבחר]"));
        box.append(sp);
      });
      info.append(fact("רכיבים, ואיזה ערך", box));
    }
    if (s.changed) { var ch = fact("מה השתנה בסבב", el("div", null, s.changed)); ch.className = "fact changed"; info.append(ch); }
    card.append(info);
    var wrap = el("div", "wf-wrap"), wf = el("div", "wf " + (desk ? "desk" : "phone"));
    blocks(s.wireframe, wf);
    wrap.append(wf, el("span", "wf-cap", "wireframe · " + (desk ? "מחשב" : "נייד") + " · נאמנות נמוכה"));
    card.append(wrap);
    grid.append(card);
  });

  var open = (d.open || []).filter(Boolean), ou = document.getElementById("open");
  open.forEach(function (t) { ou.append(el("li", null, t)); });
  document.getElementById("opensec").hidden = !open.length;
})();
