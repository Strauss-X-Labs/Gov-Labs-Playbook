<title>Prototype</title>
<!--
  תבנית ה-Prototype — דף נפרד מהבריף, ברמת גימור גבוהה: איך המערכת העתידית תיראה ותרגיש, בתוך מכשיר אמיתי.
    נשמר במיזם כ-01-ימים/05-Design-Sprint/תוצרים/Prototype.html. נוצר יחד עם בריף Draft 0 (kind: "Draft 0"), ומתעדכן יחד עם בריף המסכים (kind: "בריף"):
    באותה ריצה, מאותם מסכים ומאותו מסלול. הבריף נשאר בנאמנות נמוכה. כאן High Fidelity, בשפה של מערכת העיצוב הממשלתית (IGDS 3.0).
  הסוכן ממלא רק את בלוק הנתונים (id="data"), ומחליף את כולו — הנתונים כאן הם דוגמה. העיצוב, המכשירים והרכיבים קבועים. לא כותבים HTML.

  הנתונים:
    example: true רק בדוגמה (פס "דוגמה") · venture · kind: "Draft 0" / "בריף" · updated: תאריך (27.11.2026) · brief: קישור https לדף הבריף (רשות)
    frame: צבע המכשיר — "blue" (ברירת מחדל) · "teal" · "pink" · "orange" · "graphite" · "silver"
    service: name — שם השירות · agent — שם הסוכן בשירות, אם יש · owner — הגוף, בשורה (רשות) · mark — אות לסמל השירות (רשות)
             address — כתובת בדיונית לשורת הכתובת במחשב (רשות; ברירת מחדל prototype.app. כתובת של gov.il לא מוצגת)
    actors: id (אות — A, B), name, device: "iphone" / "desktop" / "tablet" (מתקבל גם "נייד" / "מחשב" / "טאבלט")
    path: סדר המסכים במסלול המרכזי — כמו path בבריף. חסר — לפי סדר המסכים. מסך שלא במסלול מופיע ב"מסכים נוספים", ומגיעים אליו ב-"to"
    start: מסך הפתיחה (רשות; ברירת מחדל — הראשון במסלול). גם #A3 או ?s=A3 בכתובת פותחים את A3
    screens: code (כמו בבריף) · actor · name · step (שלב בתרחיש, רשות) · note (שורה למציג: מה המסך מראה, ואיזו התנהגות משאלת ה-MVP)
             components (שמות הרכיבים מהמפרט שבמסך) · device (רשות — עוקף את המכשיר של השחקן)
             lock: true — מסך הנעילה של iPhone, וההתראות עליו (לפתיחה בהתראה יזומה)
             auto: { to, after } — עובר לבד למסך to אחרי after מילישניות (ברירת מחדל 2400) — למצבי "בבדיקה"
             header: { title, subtitle, back: קוד מסך או true (המסך הקודם), backText (מחשב), avatar: "agent" / "service", live: true — נקודה ירוקה, הסוכן זמין }
                     חסר — הכותרת היא name. false — בלי כותרת. avatar חסר — "agent" אם יש במסך הודעה מהסוכן
             nav (מחשב / טאבלט): [{ text, icon, to, active, count }] — תפריט צד · alerts: מספר על הפעמון (מחשב / טאבלט)
             body: אבני בניין, מלמעלה למטה · footer: אבני בניין בתחתית — בנייד, הפעולות הקבועות למטה; במחשב, שורת הפעולות
  אבני הבניין — { "t": ... }. כל אחת יכולה לקבל "to" (קוד מסך) — לחיצה עוברת למסך:
    agent { text, name, time, typing } — הודעה מהסוכן · user { text, time } — הודעה של המשתמש · quick { items: [{ text, to }] } — תשובות מהירות
    push { app, title, text, time, to } — התראה (בנייד נכנסת מלמעלה; במסך נעילה — על המסך; במחשב — בפינה)
    hero { kicker, title, text, icon, tone: "soft", ring: { value, max, label } } · heading { text, meta, action: { text, to } } · text { text, muted, small, center }
    card { icon, title, text, meta, badge: { text, tone }, tone, to } · status { text, meta, tone, pulse } — מה הסוכן עושה עכשיו
    stepper { items: [...], current (מ-1) } · progress { label, value, max, text, tone, ring: true, center }
    checklist { title, items: [{ text, meta, state, label, to }] } — state: done (התקבל) · pending (בבדיקה) · review (לבדיקה אנושית) · fix (צריך תיקון) · wrong (לא המסמך שביקשנו) · todo (חסר)
    upload { title, file, size, state: idle / checking / ok / fix / wrong, message, label, action: { text, to }, to } — העלאה עם תוצאת בדיקה מיידית
    notice { tone, title, text, icon, action: { text, to } } · confirm { title, subtitle, rows: [{ label, value }], editable, note } — "זה מה שאנחנו יודעים"
    disclosure { title, text, open } — "למה צריך את זה?" · field { label, value, placeholder, hint, error, required, kind: text / select / date }
    choices { label, multi, items: [{ text, sub, selected, to }] } · button { text, variant: primary / secondary / link, size: large / small, icon, inline, to }
    people { title, items: [{ name, role, status, tone, done, total, to }] } · summary { title, subtitle, icon, rows: [{ label, value, tone, to }] }
    list { items: [{ text, meta, icon, to }] } · table { title, meta, columns, rows: [[...]] או [{ cells: [...], to }] — תא: טקסט, או { text, tone } לתגית }
    kpis { items: [{ label, value, meta, tone, to }] } · divider { text } · spacer · split { main: [...], side: [...] } — מחשב / טאבלט, שני טורים (בנייד — אחד מתחת לשני)
    tone: info · success · warning · error · neutral · brand
    icon: check clock alert info upload file chat person people lock shield star phone globe bell edit search home sparkle calendar camera headset eye refresh plus
    גם אבני הבניין של screens.html — title, bubble, chips, note, input, list — עובדות, ומתורגמות לרכיבים המקבילים.
  כללי התוכן:
    המסכים, הסדר והפעולות — מהבריף, אחד לאחד: אותם קודים, אותו path, אותם רכיבים. אין מסך שלא בבריף.
    נוסח הצוות — מילה במילה. כמויות, ספים או תוכן מקצועי שלא הוגדרו — [X], ומוצג כתגית "עוד לא הוגדר". **טקסט** — מודגש.
    נתונים אישיים (שמות, תאריכים, סכומים) — בדיוניים. בראש הדף תמיד: "אב-טיפוס · הנתונים לדוגמה".
    בלי סמל המדינה, ובלי הלוגו או הכתובת של gov.il — שם השירות וסמל אות בלבד. השפה הגרפית — IGDS; הזהות — של השירות.
  בדיקה: "to" שמוביל למסך שלא קיים, או קוד ב-path שאין לו מסך — מוצגים כאזהרה בראש הצד. JSON לא תקין — הודעה במקום המכשיר.
  למציג: "הבא" / "הקודם", החצים במקלדת (← הבא, → הקודם), Home — מההתחלה, "הצגת אזורים לחיצים", ו"מסך מלא" (Esc — יציאה).
    לחיצה על משהו לא לחיץ — הלחיצים מהבהבים. #A3 בכתובת — קפיצה למסך.
  לשיתוף: מפרסמים כדף (Claude Artifact) מהקובץ שב-repo, ובכל עדכון — לאותו קישור. הקישור בראש בריף-מסכים.md ובדף הבריף.
-->

<style>
  /* Layout: top bar, presenter panel (right), stage with the device scaled to the viewport height. App UI in IGDS 3.0 tokens. Light theme only. */
  :root {
    color-scheme: light;
    --brand: #0068F5; --brand-h: #0057CC; --brand-p: #0045A3; --soft: #EBF3FF; --tint: #B7D6FF; --info-bg: #E8F0FC; --nh: #F2F6FD;
    --ink: #0C3058; --ink2: #466186; --dis: #5C697A; --div: #B5C7E2; --line: rgba(181, 199, 226, 0.55);
    --err: #A72223; --err-bg: #FFCBCB; --ok: #347314; --ok-bg: #DDFFCD; --warn: #A35200; --warn-bg: #FFECC2; --badge: #C93435; --focus: #FFDD00;
    --sh1: 0 2px 8px rgba(6, 77, 173, 0.1); --sh2: 0 4px 12px rgba(6, 77, 173, 0.15); --sh3: 0 10px 24px rgba(0, 104, 245, 0.15);
    --font: "Rubik", "Assistant", "Arial Hebrew", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden;
    display: grid; grid-template-rows: auto auto minmax(0, 1fr);
    background: radial-gradient(1000px 640px at 12% -8%, #fff 0%, rgba(255, 255, 255, 0) 60%), radial-gradient(900px 620px at 96% 106%, var(--info-bg) 0%, rgba(232, 240, 252, 0) 60%), var(--nh); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .example { grid-row: 1; background: var(--warn-bg); color: var(--warn); font-weight: 500; text-align: center; padding: 5px 12px; font-size: 14px; border-bottom: 1px dashed var(--warn); }

  /* ===== top bar ===== */
  .top { grid-row: 2; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 22px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--brand), var(--brand-p)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; box-shadow: var(--sh3); line-height: 1; }
  .svc { font-weight: 700; font-size: 17px; line-height: 1.2; }
  .own { font-size: 12.5px; color: var(--ink2); }
  .tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .tproto { background: var(--info-bg); color: var(--brand-p); }
  .twarn { background: var(--warn-bg); color: var(--warn); }
  .tupd { font-size: 13px; color: var(--ink2); white-space: nowrap; }
  .tact { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tlink { color: var(--brand-p); font-weight: 500; font-size: 14px; text-decoration: none; padding: 7px 10px; border-radius: 8px; }
  .tlink:hover { background: var(--soft); }
  .tbtn { height: 36px; border-radius: 8px; border: 1px solid var(--brand); background: #fff; color: var(--brand); padding: 0 14px; font-size: 14px; font-weight: 500; }
  .tbtn:hover { color: var(--brand-p); border-color: var(--brand-p); }
  .tbtn[aria-pressed="true"] { background: var(--soft); color: var(--brand-p); border-color: var(--brand-p); }
  .tbtn-p { background: var(--brand); color: #F5F9FF; }
  .tbtn-p:hover { background: var(--brand-h); color: #F5F9FF; }

  /* ===== presenter panel + stage ===== */
  .wrap { grid-row: 3; display: grid; grid-template-columns: 340px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; }
  .side { overflow-y: auto; padding: 18px 22px 22px 6px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
  .warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; }
  .warnbox b { display: block; margin-bottom: 2px; }
  .now { background: #fff; border-radius: 16px; box-shadow: var(--sh1); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .now-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .code { --c: var(--brand); display: inline-flex; align-items: center; font-weight: 700; font-size: 14px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, #fff); border-radius: 8px; padding: 3px 9px; letter-spacing: 0.02em; white-space: nowrap; }
  .ndev { font-size: 13px; color: var(--ink2); display: flex; align-items: center; gap: 6px; min-width: 0; }
  .nname { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25; }
  .nstep { font-size: 13px; color: var(--ink2); margin-top: -6px; }
  .lbl { display: block; font-size: 12px; font-weight: 500; color: var(--ink2); margin-bottom: 5px; }
  .nnote { background: linear-gradient(180deg, var(--soft), #fff); border: 1px solid var(--info-bg); border-radius: 12px; padding: 10px 12px; }
  .nnote p { margin: 0; font-size: 15px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { background: var(--nh); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 500; }
  .nauto { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--brand-p); }
  .ctrl { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .cbtn { height: 44px; border-radius: 8px; border: 1px solid var(--brand); background: #fff; color: var(--brand); font-weight: 500; font-size: 15px; }
  .cbtn:hover { color: var(--brand-p); border-color: var(--brand-p); }
  .cbtn-p { background: var(--brand); color: #F5F9FF; }
  .cbtn-p:hover { background: var(--brand-h); color: #F5F9FF; }
  .cbtn:disabled { opacity: 0.4; cursor: default; }
  .ccount { font-size: 14px; color: var(--ink2); font-weight: 500; min-width: 54px; text-align: center; white-space: nowrap; }
  .restart { align-self: flex-start; background: none; border: 0; color: var(--brand-p); font-weight: 500; font-size: 14px; padding: 2px 4px; }
  .route { background: #fff; border-radius: 16px; box-shadow: var(--sh1); padding: 12px 10px; }
  .route .lbl { padding-inline: 6px; }
  .route ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .rgrp { font-size: 12px; color: var(--ink2); padding: 9px 8px 3px; display: flex; align-items: center; gap: 6px; }
  .rgrp:first-child { padding-top: 2px; }
  .rdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .ri { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: 10px; padding: 7px 8px; text-align: start; font-size: 14.5px; color: var(--ink); }
  .ri:hover { background: var(--nh); }
  .ri[aria-current="step"] { background: var(--soft); font-weight: 600; }
  .ri .code { font-size: 12px; padding: 1px 7px; }
  .rn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .keys { margin: 0; font-size: 12.5px; color: var(--ink2); line-height: 1.5; }
  .stage { position: relative; min-height: 0; min-width: 0; display: grid; place-items: center; overflow: hidden; }
  .stage::before { content: ""; position: absolute; inset: 14% 16%; background: radial-gradient(closest-side, rgba(0, 104, 245, 0.17), rgba(0, 104, 245, 0)); pointer-events: none; }
  .holder { position: relative; z-index: 1; }
  .scaler { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .err-box { position: relative; z-index: 2; max-width: 560px; margin: 24px; background: #fff; border: 2px solid var(--err); color: var(--err); border-radius: 12px; padding: 14px 16px; font-weight: 500; }
  body.present .top, body.present .side { display: none; }
  body.present .wrap { grid-template-columns: minmax(0, 1fr); }
  body.present .stage { padding-bottom: 62px; }
  .pbar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: rgba(12, 48, 88, 0.86); color: #fff; border-radius: 999px; padding: 6px 8px; box-shadow: 0 10px 30px rgba(12, 48, 88, 0.3); z-index: 20; backdrop-filter: blur(8px); }
  .pbar button { background: rgba(255, 255, 255, 0.14); border: 0; color: #fff; border-radius: 999px; height: 36px; min-width: 40px; padding: 0 12px; font-size: 15px; }
  .pbar button:hover { background: rgba(255, 255, 255, 0.24); }
  .pbar span { padding: 0 8px; font-size: 14px; white-space: nowrap; }

  /* ===== device frames ===== */
  .dev { position: relative; font-family: var(--font); color: var(--ink); animation: devIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .dev[data-frame="blue"] { --f1: #cfe0ff; --f2: #5d8fe8; --f3: #2547a3; }
  .dev[data-frame="teal"] { --f1: #c9efe8; --f2: #3fb3a3; --f3: #11665b; }
  .dev[data-frame="pink"] { --f1: #ffe0ea; --f2: #f08fae; --f3: #b44a6c; }
  .dev[data-frame="orange"] { --f1: #ffe2c6; --f2: #f39248; --f3: #a84d12; }
  .dev[data-frame="graphite"] { --f1: #a7adb5; --f2: #4d535b; --f3: #1d2025; }
  .dev[data-frame="silver"] { --f1: #fdfdfe; --f2: #d3d6db; --f3: #949aa3; }
  .metal { background: linear-gradient(135deg, var(--f1) 0%, var(--f2) 20%, var(--f3) 46%, var(--f2) 72%, var(--f1) 100%); }
  @keyframes devIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
  .vw { position: absolute; inset: 0; }
  .scn { position: absolute; inset: 0; }
  .scn.inF { animation: inF 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .scn.inB { animation: inB 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes inF { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes inB { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }

  .iphone { width: 429px; height: 888px; padding: 6px; border-radius: 73px;
    box-shadow: 0 50px 90px -22px rgba(12, 48, 88, 0.45), 0 18px 36px -14px rgba(12, 48, 88, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.5), inset 0 0 3px 1px rgba(0, 0, 0, 0.35); }
  .iphone .bezel { width: 100%; height: 100%; background: #050608; border-radius: 67px; padding: 12px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07); }
  .iphone .scr { position: relative; width: 393px; height: 852px; border-radius: 55px; overflow: hidden; background: var(--nh); isolation: isolate; }
  .sbtn { position: absolute; width: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--f3), var(--f1) 50%, var(--f3)); }
  .sbtn.l1 { left: -3px; top: 168px; height: 32px; } .sbtn.l2 { left: -3px; top: 222px; height: 62px; } .sbtn.l3 { left: -3px; top: 298px; height: 62px; } .sbtn.r1 { right: -3px; top: 262px; height: 98px; }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 40; }
  .island::after { content: ""; position: absolute; right: 14px; top: 50%; width: 11px; height: 11px; margin-top: -5.5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #33455e, #0a0f17 60%); }
  .sbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 3px 14px 0; z-index: 35; font-weight: 600; font-size: 16.5px; color: var(--ink); pointer-events: none; letter-spacing: -0.01em; transition: color 0.3s; }
  .sbar .st, .sbar .si { width: 118px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .light .sbar { color: #fff; }
  .hind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 40; pointer-events: none; }
  .lockon .hind { background: #fff; }

        var w = $("warn"); w.hidden = false;
        msgs.forEach(function (m) { var p = el("div"); p.appendChild(el("b", null, "⚠ " + m[0])); p.appendChild(document.createTextNode(m[1])); w.appendChild(p); });
      }
    })();

    // ---------- init ----------
    if (D.example) $("example").hidden = false;
    document.title = SV_NAME + " · Prototype";
    $("tmark").textContent = MARK; $("tsvc").textContent = SV_NAME;
    $("town").textContent = [SVC.owner, D.venture].filter(Boolean).join(" · ");
    $("tkind").textContent = "Prototype" + (D.kind === "בריף" ? " · לפי בריף המסכים" : D.kind ? " · לפי בריף " + D.kind : "");
    if (D.updated) $("tupd").textContent = "עודכן: " + D.updated; else $("tupd").hidden = true;
    if (/^https:\/\//.test(D.brief || "")) { $("tbrief").href = D.brief; $("tbrief").hidden = false; }
    if (!screens.length) { fail("אין מסכים בבלוק הנתונים (screens)."); return; }
    routeList(path, $("route"));
    if (extras.length) { var ex = $("extra"); ex.appendChild(el("span", "lbl", "מסכים נוספים — לא במסלול")); var ol = el("ol"); ex.appendChild(ol); routeList(extras, ol); ex.firstChild.style.marginTop = "10px"; }

    stage.addEventListener("click", function (e) {
      var t = e.target.closest ? e.target.closest("[data-to],[data-back]") : null;
      if (t && stage.contains(t)) { e.preventDefault(); if (t.hasAttribute("data-to")) go(t.getAttribute("data-to")); else back(); return; }
      if (e.target.closest && e.target.closest(".vw") && !e.target.closest("input, textarea, .chi, .dc, .hot")) flash();
    });
    stage.addEventListener("keydown", function (e) {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-to]:not(button), .chi")) { e.preventDefault(); e.target.click(); }
    });
    document.addEventListener("keydown", function (e) {
      var t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === "ArrowLeft" || e.key === "PageDown") { e.preventDefault(); next(); }
      else if (e.key === "ArrowRight" || e.key === "PageUp") { e.preventDefault(); prev(); }
      else if (e.key === "Home") { e.preventDefault(); go(path[0]); }
      else if (e.key === "Escape" && present) setPresent(false);
    });
    $("bnext").addEventListener("click", next); $("bprev").addEventListener("click", prev); $("bstart").addEventListener("click", function () { hist = []; go(path[0]); });
    $("pnext").addEventListener("click", next); $("pprev").addEventListener("click", prev); $("pexit").addEventListener("click", function () { setPresent(false); });
    $("bpres").addEventListener("click", function () { setPresent(true); });
    $("bhot").addEventListener("click", function () { var on = !document.body.classList.contains("show-hot"); document.body.classList.toggle("show-hot", on); this.setAttribute("aria-pressed", on ? "true" : "false"); });
    window.addEventListener("hashchange", function () { var h = fromLoc(); if (h && h !== cur) go(h); });
    window.addEventListener("resize", fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

    go(fromLoc() || (S[D.start] ? D.start : path[0]), "init");
  }
})();
</script>
