<title>טבלת הרכיבים</title>

<!--
  תבנית טבלת הרכיבים — מטריצת ערך-לרכיב. נשמר במיזם כ-מפרט-MVP-רכיבים.html, ליד מפרט-MVP.md, ונגזר מסעיף 5 שלו (כל הרכיבים בטבלה).
  הסוכן ממלא את בלוק הנתונים (id="data") ומחליף את כולו — הנתונים כאן הם דוגמה — ואת <title>: "טבלת הרכיבים: <שם המיזם>". העיצוב קבוע. Light theme בלבד.
  הטבלה נבנית לפני התרחישים — אין בה שלב בתרחיש ואין כיסוי לפי תרחיש. הקשר רכיב ← תרחיש נמצא בדף התרחישים.

  example: true רק בדוגמה (מציג פס "דוגמה") · venture: שם המיזם · org: שורת המיזם — הגורם המזמין והשירות, למשל "<השירות>, <הגוף>"
  updated: תאריך העדכון האחרון, "dd.mm.yyyy" — הדף מעדכן אותו בכל "שמירה לכולם"
  question: שאלת ה-MVP, מילה במילה · questionStatus: רשות, למשל "הצעה" · questionUrl: קישור מלא לדף המפרט ("לדף המלא"), רשות
  forLabel: למי הערך — "לתושב", "למשפחה", "למגדל" (מופיע לפני משמעות הערך)
  values: לכל ערך מוצר מיום 4 — id, name (מילה במילה), tag (רשות, למשל "ערך ליבה"), meaning (מה הערך אומר לפרסונה, במילים שלה),
          basis (על מה הוא נשען: בעיות ופתרונות מהקנבס, ציטוט מהשטח, ואיך זה נשמע — שורה), ו-rows:
    rows: לכל רכיב שמבטא את הערך — id, star (true לרכיב אחד בכל ערך: זה שמבליט את הערך יותר מכל),
          principle — התנהגות הממשק (UX Principle): משפט, מה הממשק עושה בשביל הערך
          component — שם הרכיב, כללי וקצר, ואחריו המונח המקובל באנגלית בסוגריים ("תזכורת (Reminder)") · detail — שורה: מצבים, וריאנט, איפה (רשות)
          microcopy — טקסט לדוגמה שהמשתמש רואה ברכיב (לדוגמה — לא נוסח סופי) · mvp — "בפנים" / "מינימלי" / "בחוץ" (הצעה; הצוות מחליט)
          team — true לרכיב שהצוות הוסיף בדף (הדף מסמן לבד)
  ההצעה של הסוכן: ★ אחד לכל ערך, ועד 5 רכיבים "בפנים" או "מינימלי" — כולל ה-★. השאר "בחוץ" — בקלוג, לא נמחק.

  עריכה ושמירה: כפתור "עריכה" נכנס למצב עריכה, ואותו כפתור — "סיום עריכה" — יוצא ממנו. בעריכה: כל תא, ★, ב-MVP, הוספה והסרה של רכיבים.
  "שמירה לכולם" מפרסמת את הדף מחדש עם הנתונים החדשים (יכולת artifact) — וכל מי שפתוח אצלו הדף רואה את הגרסה החדשה.
  מפרסמים עם capabilities: { artifact: {} }. בלי היכולת, או בלי הרשאת עריכה — העריכה נשמרת רק בדפדפן, ו"העתקת סיכום" מחזירה Markdown.
  הסוכן קורא את השמירה מהדף המפורסם (בלוק הנתונים), ולא מבקש להדביק. לפני כל פרסום מחדש מה-repo — קוראים את הגרסה החיה, כדי לא לדרוס את מה שהקבוצה שמרה.
  לשיתוף: מפרסמים כדף (Claude Artifact) מהקובץ שב-repo, ובכל עדכון לאותו קישור.
  הדוגמה מפורסמת: https://claude.ai/artifact/D69YExRMvKqxb6zWXF68Ez — עדכון התבנית: מפרסמים את הקובץ הזה לאותו קישור, עם capabilities: { artifact: {} }.
-->

    var t = document.getElementById("toast");
    if (!t) { t = el("div", "toast"); t.id = "toast"; t.setAttribute("role", "status"); t.append(el("span"), el("button")); document.body.append(t); }
    t.firstChild.textContent = msg;
    var b = t.lastChild; b.type = "button"; b.hidden = !action; b.textContent = action || "";
    b.onclick = function () { t.hidden = true; if (fn) fn(); };
    t.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, action ? 9000 : 6000);
  }

  render();
  if (pendingDraft) {
    toast("יש לכם שינויים שלא נשמרו, ובינתיים נשמרה גרסה חדשה.", "שחזור השינויים שלי", function () { state = pendingDraft; pendingDraft = null; editing = true; render(); writeDraft(); });
  }

  function initSave() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") { canSave = false; updateBar(); return; }
    var t = setTimeout(function () { if (canSave === null) { canSave = false; updateBar(); } }, 10000);
    c.use("artifact").then(function (a) { clearTimeout(t); art = a || null; canSave = !!a; updateBar(); }, function () { clearTimeout(t); canSave = false; updateBar(); });
    try { c.use("user").then(function (u) { if (u && typeof u.canEdit === "function") u.canEdit().then(function (ok) { if (ok === false) { canSave = false; updateBar(); } }, function () {}); }, function () {}); } catch (e) {}
  }
  if (window.claude) initSave(); else if (document.readyState === "complete") setTimeout(initSave, 60); else window.addEventListener("load", function () { setTimeout(initSave, 60); });
})();
</script>
