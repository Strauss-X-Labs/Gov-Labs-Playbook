<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>לוח הרכיבים</title>
<!--
  תבנית לוח בחירת הרכיבים — נשמר במיזם כ-מפרט-MVP-רכיבים.html, ליד מפרט-MVP.md, ונגזר מסעיף 5 שלו (כל הרכיבים בלוח).
  הסוכן ממלא רק את בלוק הנתונים (id="data"), ומחליף את כולו — הנתונים כאן הם דוגמה. העיצוב קבוע. Light theme בלבד.
  example: true רק בדוגמה (מציג פס "דוגמה") · question: שאלת ה-MVP שנבחרה, מילה במילה · max: כמה רכיבים בוחרים (5)
  parts: חלקי השאלה שה-MVP צריך לבדוק — id, text (קצר, במילים של השאלה)
  values: id, name (שם הערך, מילה במילה), meaning (שורה, רשות)
  components: id, rank (מספר הדירוג; null לרכיב שהצוות העלה),
              name — שם הרכיב: קצר וכללי, סוג רכיב ("התראות", "צ'אט עם הסוכן"), לא מקרה ("התראה על שינוי בתמהיל המים")
              example — דוגמה במשפט: איך זה נראה אצל המשתמש ("התראה שמודיעה למגדל על שינוי ב...")
              checks — מה זה בודק: במשפט, בהקשר של שאלת ה-MVP
              values (מזהי ערכים — הראשון קובע את העמודה), tests (מזהי חלקי השאלה — לא מוצג בכרטיס, משמש לכיסוי ולהודעות),
              recommended (true לחמשת המומלצים), overlap (true אם הופיע גם ברשימות האישיות), source ("team" לרכיב שהצוות העלה),
              selected (true אחרי שהצוות בחר; אם אף רכיב לא סומן — הלוח נפתח עם ההמלצה בחורה)
  יכולות מאחורי הקלעים — לא בלוח. הן במפרט, סעיף 3.
  ההמלצה היא המלצה: הצוות מוסיף, מוריד, משנה ובוחר. ההודעות מתעדכנות לפי הבחירה. עריכות נשמרות בדפדפן.
  "העתקת סיכום" מחזירה Markdown של כל הלוח — מה נבחר, ומה לא נבחר (לבקלוג), ומה השתנה.
  לשיתוף: מפרסמים כדף (Claude Artifact) מהקובץ שב-repo, ובכל עדכון לאותו קישור.
  הדוגמה מפורסמת: https://claude.ai/artifact/D69YExRMvKqxb6zWXF68Ez — עדכון התבנית: מפרסמים את הקובץ הזה לאותו קישור.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: header + question with live part coverage, sticky selection bar, live messages, one column per value, simple cards. Light theme only. */
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --paper: #ffffff; --ink: #1c2430; --muted: #5d6878; --line: #d5dae2;
    --navy: #1b2a4a; --navy-soft: #e8ecf3; --sel: #1e7a45; --sel-bg: #e3f4ea;
    --warn: #b42318; --warn-bg: #fdecea; --info: #1f5f8b; --info-bg: #e7f0f7;
    --rec: #8a5a00; --rec-bg: #fdb415; --rec-soft: #fff6dc;
    --team: #6b3fa0; --team-bg: #f1ebf8; --focus: #1a5fd0;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Assistant", "Heebo", "Arial Hebrew", Arial, sans-serif; font-size: clamp(14px, 0.9vw, 20px); line-height: 1.45; padding-block: 1.2em 3em; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: hidden; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  button { font: inherit; cursor: pointer; }
  .example { background: var(--rec-soft); border: 1px dashed var(--rec); color: var(--rec); font-weight: 700; border-radius: 8px; padding: 0.3em 0.8em; margin-bottom: 0.8em; }
  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.85em; font-weight: 800; text-wrap: balance; }
  h1 .tag { font-weight: 600; color: var(--muted); }
  .sub { color: var(--muted); margin-top: 0.15em; }
  .ribbon { background: var(--navy); color: #fff; font-weight: 800; padding: 0.35em 1em; border-radius: 999px; }
  .question { margin: 0.9em 0 0; background: var(--paper); border: 1px solid var(--line); border-inline-start: 6px solid var(--navy); border-radius: 10px; padding: 0.7em 1em; display: grid; gap: 0.5em; }
  .lbl { font-size: 0.82em; font-weight: 700; color: var(--muted); }
  .q { font-size: 1.2em; font-weight: 800; overflow-wrap: anywhere; }
  .parts { display: flex; gap: 0.4em; flex-wrap: wrap; }
  .part { font-weight: 700; font-size: 0.9em; border-radius: 999px; padding: 0.1em 0.7em; border: 1.5px solid; overflow-wrap: anywhere; }
  .part.ok { color: var(--sel); border-color: var(--sel); background: var(--sel-bg); }
  .part.miss { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
  .legend { display: flex; flex-wrap: wrap; gap: 0.4em 1.2em; margin-top: 0.8em; color: var(--muted); font-size: 0.92em; align-items: center; }
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 0.9em calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0.6em; padding: 0.6em max(16px, env(safe-area-inset-left, 0px)); background: rgba(244, 245, 247, 0.97); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 0.8em; flex-wrap: wrap; }
  .count { font-weight: 800; font-size: 1.15em; background: var(--sel-bg); color: var(--sel); border-radius: 999px; padding: 0.15em 0.8em; white-space: nowrap; }
  .bar.over .count { background: var(--warn-bg); color: var(--warn); }
  .chosen { display: flex; gap: 0.35em; flex-wrap: wrap; flex: 1 1 20em; min-width: 0; }
  .chosen span { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 0.05em 0.6em; font-weight: 700; font-size: 0.88em; overflow-wrap: anywhere; }
  .chosen span.rec { border-color: var(--rec-bg); }
  .tools { display: flex; gap: 0.4em; flex-wrap: wrap; }
  .btn { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 0.3em 0.8em; font-weight: 700; color: var(--ink); }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn[aria-pressed="true"] { background: var(--navy-soft); border-color: var(--navy); }
  .msgs { display: grid; gap: 0.4em; margin-bottom: 1em; }
  .msg { border-radius: 8px; padding: 0.45em 0.8em; font-weight: 600; border-inline-start: 5px solid; overflow-wrap: anywhere; }
  .msg.warn { background: var(--warn-bg); border-color: var(--warn); color: #7a1a12; }
  .msg.info { background: var(--info-bg); border-color: var(--info); color: #173f5c; }
  .msg.ok { background: var(--sel-bg); border-color: var(--sel); color: #14532d; }
  .msg b { font-weight: 800; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(19em, 1fr)); gap: 1em; align-items: start; }
  .col { --c: #1b2a4a; background: color-mix(in srgb, var(--c) 6%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 25%, var(--line)); border-top: 5px solid var(--c); border-radius: 12px; padding: 0.8em; display: flex; flex-direction: column; gap: 0.7em; min-width: 0; }
  .colhead h2 { margin: 0; font-size: 1.3em; color: var(--c); overflow-wrap: anywhere; }
  .colhead p { margin: 0.1em 0 0; color: var(--muted); font-size: 0.92em; }
  .cards { display: flex; flex-direction: column; gap: 0.6em; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 0.7em 0.8em; display: flex; flex-direction: column; gap: 0.5em; min-width: 0; }
  .card.rec { border-color: var(--rec-bg); }
  .card.sel { box-shadow: 0 0 0 2px var(--sel) inset; border-color: var(--sel); }
  .card .head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.5em; align-items: center; }
  .rank { width: 1.9em; height: 1.9em; border-radius: 50%; background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--c); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9em; }
  .rank.team { background: var(--team-bg); color: var(--team); }
  .name { margin: 0; font-size: 1.15em; font-weight: 800; overflow-wrap: anywhere; }
  .field { display: grid; gap: 0.05em; }
  .flbl { font-size: 0.78em; font-weight: 700; color: var(--muted); }
  .field p { margin: 0; overflow-wrap: anywhere; }
  .ed { border-radius: 4px; padding: 0 0.15em; cursor: text; }
  .ed:hover { background: var(--navy-soft); }
  .ed:empty::before { content: attr(data-ph); color: var(--muted); font-weight: 400; }
  .pick { display: inline-flex; align-items: center; gap: 0.3em; font-weight: 700; font-size: 0.88em; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .pick input { width: 1.15em; height: 1.15em; accent-color: var(--sel); cursor: pointer; }
  .card.sel .pick { color: var(--sel); }
  .rectag { align-self: flex-start; background: var(--rec-bg); color: #3b2a00; font-weight: 800; font-size: 0.82em; border-radius: 6px; padding: 0.1em 0.6em; letter-spacing: 0.02em; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 0.5em; }
  .src { font-size: 0.8em; font-weight: 700; color: var(--team); }
  .rm { margin-inline-start: auto; background: none; border: none; color: var(--muted); font-size: 0.85em; padding: 0.1em 0.3em; text-decoration: underline; }
  .add { background: none; border: 1.5px dashed color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 10px; padding: 0.45em; color: var(--c); font-weight: 800; }
  .board.only .card:not(.sel), .board.only .add { display: none; }
  .empty { color: var(--muted); font-style: italic; }
  details.out { margin-top: 1em; }
  details.out summary { cursor: pointer; font-weight: 700; color: var(--muted); }
  details.out pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 0.8em; font-family: inherit; margin: 0.5em 0 0; }
  .toast { position: fixed; inset-inline: 0; bottom: calc(1.2em + env(safe-area-inset-bottom, 0px)); margin: auto; width: max-content; max-width: calc(100% - 2em); background: var(--ink); color: #fff; border-radius: 10px; padding: 0.55em 0.9em; display: flex; gap: 0.8em; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.2); z-index: 10; }
  .toast button { background: none; border: 1px solid rgba(255,255,255,.5); color: #fff; border-radius: 6px; padding: 0.1em 0.6em; font-weight: 700; }
  @media (max-width: 640px) { .board { grid-template-columns: 1fr; } }
  @media print { .bar .tools, .rm, .add, .toast, details.out { display: none !important; } body { background: #fff; } .card { break-inside: avoid; } }
</style>
</head>
<body>
<div class="example" id="example" hidden>דוגמה — מיזם לדוגמה, לא מיזם אמיתי. הסוכן מחליף את כל הנתונים.</div>
<header class="top">
  <div>
    <h1>רכיבים לשאלת ה-MVP <span class="tag" id="venture"></span></h1>
    <div class="sub" id="meta"></div>
  </div>
  <div class="ribbon">ההמלצה היא המלצה. הצוות מחליט.</div>
</header>
<div class="question" id="qbox">
  <div><div class="lbl">שאלת ה-MVP</div><div class="q" id="question"></div></div>
  <div id="partsbox"><div class="lbl">מה הרכיבים צריכים לבדוק</div><div class="parts" id="parts"></div></div>
</div>
<div class="legend"><span class="rectag">מומלץ</span><span>אחד מחמשת הרכיבים שה-AI ממליץ עליהם. הלוח נפתח כשהם בחורים — מוסיפים, מורידים ומחליטים.</span></div>

<div class="bar" id="bar">
  <span class="count" id="count" aria-live="polite"></span>
  <div class="chosen" id="chosen"></div>
  <div class="tools">
    <button type="button" class="btn" id="only" aria-pressed="false">רק הנבחרים</button>
    <button type="button" class="btn primary" id="copy">העתקת סיכום</button>
    <button type="button" class="btn" id="reset">חזרה להמלצה</button>
  </div>
</div>
<div class="msgs" id="msgs" aria-live="polite"></div>

<main class="board" id="board"></main>

<details class="out" id="out"><summary>הסיכום, כ-Markdown — כל הרכיבים בלוח</summary><pre id="summary"></pre></details>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastBtn" hidden></button></div>

<script type="application/json" id="data">
{
  "example": true,
  "venture": "מיזם לדוגמה",
  "date": "דוגמה",
  "question": "האם תושב שמקבל מהסוכן, ולא מפקיד בטלפון, הודעה על מסמך חסר עם הסבר מה להעלות, יעלה את המסמך לפני המועד?",
  "max": 5,
  "parts": [
    { "id": "p1", "text": "הודעה מהסוכן, ולא מפקיד" },
    { "id": "p2", "text": "הסבר מה להעלות" },
    { "id": "p3", "text": "מעלה לפני המועד" }
  ],
  "values": [
    { "id": "v1", "name": "פשטות", "meaning": "אני יודע מה לעשות, בלי לחפש" },
    { "id": "v2", "name": "אמון", "meaning": "אני יודע מי עומד מאחורי ההודעה" },
    { "id": "v3", "name": "ליווי", "meaning": "אני לא נשאר לבד" }
  ],
  "components": [
    { "id": "c1", "rank": 1, "name": "התראות", "example": "התראה לטלפון: \"חסר אישור תושבות לבקשה שלך. אפשר להעלות עד ה-20 בחודש.\"", "checks": "אם הודעה יזומה מהסוכן מספיקה כדי שהתושב יפעל, בלי שפקיד יתקשר אליו.", "values": ["v1"], "tests": ["p1"], "recommended": true, "overlap": true },
    { "id": "c2", "rank": 2, "name": "העלאת מסמכים", "example": "צילום או קובץ, בלחיצה אחת מתוך ההודעה.", "checks": "את ההתנהגות עצמה: האם התושב מעלה את המסמך, ומתי.", "values": ["v1"], "tests": ["p3"], "recommended": true },
    { "id": "c3", "rank": 3, "name": "הסבר על המסמך", "example": "איזה מסמך צריך, איך הוא נראה, ולמה הוא נדרש.", "checks": "אם מה שחסר לתושב הוא הסבר ברור — החלק בשאלה על \"הסבר מה להעלות\".", "values": ["v1", "v2"], "tests": ["p2"], "recommended": true },
    { "id": "c4", "rank": 4, "name": "תווית מקור", "example": "מתחת להודעה: \"נוסח ע\"י הסוכן · אושר ע\"י [שם הפקיד]\".", "checks": "אם התושב סומך על הודעה מהסוכן, כשברור שאדם אישר אותה.", "values": ["v2"], "tests": ["p1"], "recommended": true },
    { "id": "c5", "rank": 5, "name": "תזכורות", "example": "יום לפני המועד, למי שעוד לא העלה.", "checks": "אם תזכורת אחת מגדילה את מספר המעלים לפני המועד.", "values": ["v3"], "tests": ["p3"], "recommended": true },
    { "id": "c6", "rank": 6, "name": "צ'אט עם הסוכן", "example": "התושב שואל \"איזה אישור זה?\" ומקבל תשובה מיד.", "checks": "אם מי שלא הבין את ההסבר מצליח להעלות אחרי שאלה אחת.", "values": ["v3"], "tests": ["p2"] },
    { "id": "c7", "rank": 7, "name": "אישור פקיד", "example": "הסוכן מנסח את ההודעה, והפקיד מאשר בלחיצה, מתקן, או כותב בעצמו.", "checks": "אם פקיד יכול לאשר את ההודעות של הסוכן בקצב שהשירות צריך.", "values": ["v2"], "tests": ["p1"] },
    { "id": "c8", "rank": 8, "name": "פנייה לפקיד", "example": "כפתור \"לדבר עם פקיד\" — והפקיד רואה את הבקשה ואת ההודעה.", "checks": "לא בודק את השאלה עצמה. רשת ביטחון למי שנתקע — כדי שלא יוותר.", "values": ["v3"], "tests": [] },
    { "id": "c9", "rank": 9, "name": "מעקב אחרי הבקשה", "example": "מה קורה עם הבקשה אחרי שהמסמך הועלה.", "checks": "לא בודק את השאלה. שימושי אחרי ה-MVP, כשבודקים את כל התהליך.", "values": ["v2"], "tests": [] }
  ]
}
</script>
<script>
(function () {
  var COLORS = ["#1f5f8b", "#7a3f96", "#a8551f", "#2c7448", "#9c2f4a", "#566a1f"];
  var raw = document.getElementById("data").textContent;
  var d = JSON.parse(raw);
  var MAX = d.max || 5;
  var values = (d.values || []).filter(function (v) { return v && v.name; });
  var vIndex = {}; values.forEach(function (v, i) { vIndex[v.id] = i; });
  var parts = (d.parts || []).filter(function (p) { return p && p.text; });
  var pIndex = {}; parts.forEach(function (p, i) { pIndex[p.id] = i; });
  // תאימות לאחור: לוחות שנבנו עם does / why
  var baseComps = (d.components || []).filter(function (c) { return c && c.name; }).map(function (c) {
    var o = JSON.parse(JSON.stringify(c));
    if (o.example == null) o.example = o.does || "";
    if (o.checks == null) o.checks = o.why || "";
    delete o.does; delete o.why; delete o.type;
    return o;
  });
  var anySelected = baseComps.some(function (c) { return c.selected; });
  var KEY = "mvp-board:" + hash(raw);
  var onlySel = false, toastTimer = null;

  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return String(h); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fresh() {
    return { comps: baseComps.map(function (c) {
      var o = JSON.parse(JSON.stringify(c)); o.values = o.values || []; o.tests = o.tests || [];
      o.selected = anySelected ? !!o.selected : !!o.recommended; return o;
    }), seq: 0 };
  }
  function load() { try { var s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.comps) return s; } catch (e) {} return null; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var state = load() || fresh();

  function byRank(a, b) { var ra = a.rank == null ? 1e9 : a.rank, rb = b.rank == null ? 1e9 : b.rank; return ra - rb; }
  function primary(c) { var vs = c.values || []; for (var i = 0; i < vs.length; i++) if (vs[i] in vIndex) return vs[i]; return "_none"; }
  function valueNames(c) { return (c.values || []).filter(function (id) { return id in vIndex; }).map(function (id) { return values[vIndex[id]].name; }).join(", "); }
  function partNames(ids) { return (ids || []).filter(function (id) { return id in pIndex; }).map(function (id) { return "«" + parts[pIndex[id]].text + "»"; }).join(", "); }
  function names(list) { return list.map(function (c) { return "«" + (c.name || "רכיב") + "»"; }).join(", "); }
  function selected() { return state.comps.filter(function (c) { return c.selected; }).sort(byRank); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }

  if (d.example) document.getElementById("example").hidden = false;
  document.title = "לוח הרכיבים — " + (d.venture || "");
  document.getElementById("venture").textContent = d.venture ? "— " + d.venture : "";
  document.getElementById("meta").textContent = [d.date, "בוחרים עד " + MAX + " רכיבים", "מה שלא נבחר נשמר לבקלוג"].filter(Boolean).join(" · ");
  if (d.question) document.getElementById("question").textContent = d.question; else document.getElementById("qbox").hidden = true;
  if (!parts.length) document.getElementById("partsbox").hidden = true;

  var board = document.getElementById("board");

  function editable(tag, cls, text, label, set) {
    var n = el(tag, cls + " ed", text || "");
    var before = text || "";
    n.contentEditable = "true"; n.spellcheck = false;
    n.setAttribute("role", "textbox"); n.setAttribute("aria-label", label); n.dataset.ph = label;
    n.addEventListener("focus", function () { before = n.textContent; });
    n.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); n.blur(); }
      if (e.key === "Escape") { n.textContent = before; n.blur(); }
    });
    n.addEventListener("paste", function (e) {
      e.preventDefault();
      var t = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\s+/g, " ");
      document.execCommand("insertText", false, t);
    });
    n.addEventListener("blur", function () { var t = n.textContent.replace(/\s+/g, " ").trim(); n.textContent = t; set(t); save(); update(); });
    return n;
  }
  function field(label, cls, text, ph, set) {
    var f = el("div", "field");
    f.append(el("span", "flbl", label), editable("p", cls, text, ph, set));
    return f;
  }

  function card(c) {
    var k = el("article", "card" + (c.selected ? " sel" : "") + (c.recommended ? " rec" : ""));
    k.dataset.id = c.id;
    var head = el("div", "head");
    var team = c.rank == null;
    var rank = el("span", "rank" + (team ? " team" : ""), team ? "+" : String(c.rank));
    rank.title = team ? "רכיב שהצוות הוסיף" : "מקום " + c.rank + " בדירוג";
    var name = editable("h3", "name", c.name, "שם הרכיב", function (t) { c.name = t; });
    var pick = el("label", "pick"), cb = el("input");
    cb.type = "checkbox"; cb.id = "pick-" + c.id; cb.checked = !!c.selected; cb.setAttribute("aria-label", "בחירה: " + (c.name || "רכיב"));
    cb.addEventListener("change", function () { c.selected = cb.checked; k.classList.toggle("sel", cb.checked); save(); update(); });
    pick.append(cb, el("span", null, "בחירה"));
    head.append(rank, name, pick);
    k.append(head);
    if (c.recommended) { var t = el("span", "rectag", "מומלץ"); t.title = "המלצת ה-AI. הצוות מחליט."; k.append(t); }
    k.append(field("דוגמה", "ex", c.example, "איך זה נראה אצל המשתמש", function (t) { c.example = t; }));
    k.append(field("מה זה בודק", "chk", c.checks, "מה זה בודק בשאלת ה-MVP", function (t) { c.checks = t; }));
    var foot = el("div", "foot");
    var src = c.source === "team" || team ? "הצוות הוסיף" : (c.overlap ? "גם ברשימות של הצוות" : "");
    if (src) foot.append(el("span", "src", src));
    var rm = el("button", "rm", "הסרה"); rm.type = "button";
    rm.addEventListener("click", function () { removeComp(c); });
    foot.append(rm);
    k.append(foot);
    return k;
  }

  function column(id, title, meaning, color) {
    var col = el("section", "col"); col.style.setProperty("--c", color);
    var h = el("header", "colhead"); h.append(el("h2", null, title)); if (meaning) h.append(el("p", null, meaning));
    col.append(h);
    var list = el("div", "cards");
    var mine = state.comps.filter(function (c) { return primary(c) === id; }).sort(byRank);
    mine.forEach(function (c) { list.append(card(c)); });
    if (!mine.length) list.append(el("div", "empty", "אין רכיבים לערך הזה"));
    col.append(list);
    if (id !== "_none") {
      var add = el("button", "add", "+ הוספת רכיב"); add.type = "button";
      add.addEventListener("click", function () { addComp(id); });
      col.append(add);
    }
    return col;
  }

  function render() {
    board.textContent = "";
    values.forEach(function (v, i) { board.append(column(v.id, v.name, v.meaning, COLORS[i % COLORS.length])); });
    if (state.comps.some(function (c) { return primary(c) === "_none"; })) board.append(column("_none", "בלי ערך", "לאיזה ערך הרכיב הזה שייך?", "#5d6878"));
    update();
  }

  // ההודעות — מתעדכנות בכל שינוי בבחירה. אזהרה: משהו שהבחירה משאירה פתוח. מידע: ששווה לשים לב. אישור: הבחירה מכסה את השאלה.
  function messages() {
    var sel = selected(), out = [];
    var covered = {}; sel.forEach(function (c) { (c.tests || []).forEach(function (p) { covered[p] = true; }); });
    if (sel.length > MAX) out.push(["warn", "בחרתם <b>" + sel.length + "</b> רכיבים — יותר מ-" + MAX + ". איזה מהם הכי פחות חשוב לשאלה?"]);
    parts.forEach(function (p) {
      if (covered[p.id]) return;
      var can = state.comps.filter(function (c) { return !c.selected && (c.tests || []).indexOf(p.id) !== -1; }).sort(byRank);
      var droppedRec = can.filter(function (c) { return c.recommended; });
      var t = "אף רכיב שבחרתם לא בודק את <b>«" + esc(p.text) + "»</b>";
      if (droppedRec.length) t += " — הורדתם את " + esc(names(droppedRec)) + ", שבודק את זה";
      else if (can.length) t += ". רכיבים שבודקים את זה: " + esc(names(can));
      out.push(["warn", t + "."]);
    });
    state.comps.filter(function (c) { return c.recommended && !c.selected; }).sort(byRank).forEach(function (c) {
      var still = (c.tests || []).filter(function (p) { return covered[p]; });
      if ((c.tests || []).length && still.length === c.tests.length) out.push(["info", "הורדתם את <b>" + esc("«" + c.name + "»") + "</b> מההמלצה. מה שהוא בודק עדיין מכוסה ברכיב אחר."]);
      else if (!(c.tests || []).length) out.push(["info", "הורדתם את <b>" + esc("«" + c.name + "»") + "</b> מההמלצה."]);
    });
    sel.filter(function (c) { return !c.recommended; }).forEach(function (c) {
      if (!(c.tests || []).length) out.push(["warn", "<b>" + esc("«" + (c.name || "רכיב") + "»") + "</b> לא בודק אף חלק בשאלה. למה הוא ב-MVP?"]);
      else out.push(["info", "בחרתם את <b>" + esc("«" + (c.name || "רכיב") + "»") + "</b>, שלא היה בהמלצה."]);
    });
    values.forEach(function (v) {
      if (!sel.some(function (c) { return (c.values || []).indexOf(v.id) !== -1; })) out.push(["info", "הערך <b>«" + esc(v.name) + "»</b> לא מיוצג באף רכיב שבחרתם."]);
    });
    var rec = state.comps.filter(function (c) { return c.recommended; });
    var same = rec.length && sel.length === rec.length && rec.every(function (c) { return c.selected; });
    var allCovered = parts.every(function (p) { return covered[p.id]; });
    if (same) out.push(["info", "הבחירה זהה להמלצה. זו ההחלטה שלכם? מה מהרשימות האישיות לא נכנס, ולמה?"]);
    if (allCovered && sel.length && sel.length <= MAX) out.push(["ok", "כל חלקי השאלה מכוסים."]);
    return { list: out, covered: covered };
  }

  function update() {
    var sel = selected(), m = messages();
    var bar = document.getElementById("bar");
    document.getElementById("count").textContent = "נבחרו " + sel.length + " מתוך " + MAX;
    bar.classList.toggle("over", sel.length > MAX);
    var ch = document.getElementById("chosen"); ch.textContent = "";
    sel.forEach(function (c) { ch.append(el("span", c.recommended ? "rec" : null, c.name || "רכיב")); });
    var pb = document.getElementById("parts"); pb.textContent = "";
    parts.forEach(function (p) { var ok = !!m.covered[p.id]; pb.append(el("span", "part " + (ok ? "ok" : "miss"), (ok ? "✓ " : "⚠ ") + p.text)); });
    var mb = document.getElementById("msgs"); mb.textContent = "";
    m.list.forEach(function (x) { var e = el("div", "msg " + x[0]); e.innerHTML = x[1]; mb.append(e); });
    board.classList.toggle("only", onlySel);
    document.getElementById("summary").textContent = summary(m);
  }

  function addComp(vid) {
    state.seq = (state.seq || 0) + 1;
    var c = { id: "t" + Date.now().toString(36) + state.seq, rank: null, name: "", example: "", checks: "", values: [vid], tests: [], source: "team", selected: false };
    state.comps.push(c); save(); render();
    var n = board.querySelector('[data-id="' + c.id + '"] .name'); if (n) n.focus();
  }

  function removeComp(c) {
    var i = state.comps.indexOf(c); if (i < 0) return;
    state.comps.splice(i, 1); save(); render();
    toast('"' + (c.name || "רכיב") + '" הוסר', "ביטול", function () { state.comps.splice(i, 0, c); save(); render(); });
  }

  function line(c, i) {
    var bits = [];
    if (c.example) bits.push("דוגמה: " + c.example);
    if (c.checks) bits.push("מה זה בודק: " + c.checks);
    var vs = valueNames(c), ts = partNames(c.tests);
    if (vs) bits.push("ערך: " + vs);
    if (ts) bits.push("חלק בשאלה: " + ts);
    var tags = [];
    if (c.recommended) tags.push("מומלץ");
    if (c.rank == null || c.source === "team") tags.push("הצוות הוסיף"); else tags.push("מקום " + c.rank);
    if (c.overlap) tags.push("גם ברשימות של הצוות");
    return (i != null ? (i + 1) + ". " : "- ") + "**" + (c.name || "רכיב") + "**" + (bits.length ? " — " + bits.join(" · ") : "") + " · " + tags.join(" · ");
  }

  function summary(m) {
    var sel = selected(), rest = state.comps.filter(function (c) { return !c.selected; }).sort(byRank);
    var L = [];
    if (d.question) L.push("**שאלת ה-MVP:** " + d.question, "");
    L.push("### נבחרו ל-MVP (" + sel.length + " מתוך " + MAX + ")");
    if (!sel.length) L.push("- —");
    sel.forEach(function (c, i) { L.push(line(c, i)); });
    L.push("", "### לא נבחרו — לבקלוג (" + rest.length + ")");
    if (!rest.length) L.push("- —");
    rest.forEach(function (c) { L.push(line(c)); });
    if (parts.length) {
      L.push("", "### חלקי השאלה");
      parts.forEach(function (p) { L.push("- " + (m.covered[p.id] ? "✓ " : "⚠ לא מכוסה: ") + p.text); });
    }
    var rec = state.comps.filter(function (c) { return c.recommended; });
    var dropped = rec.filter(function (c) { return !c.selected; }), added = sel.filter(function (c) { return !c.recommended; });
    if (dropped.length || added.length) {
      L.push("", "### מול ההמלצה");
      if (dropped.length) L.push("- הורדו מההמלצה: " + names(dropped));
      if (added.length) L.push("- נוספו מעבר להמלצה: " + names(added));
    }
    var changes = [];
    baseComps.forEach(function (b) {
      var c = state.comps.filter(function (x) { return x.id === b.id; })[0];
      if (!c) { changes.push('- הוסר מהלוח: "' + b.name + '"'); return; }
      if ((c.name || "") !== (b.name || "")) changes.push('- שם: "' + b.name + '" ← "' + c.name + '"');
      if ((c.example || "") !== (b.example || "")) changes.push('- דוגמה ב"' + (c.name || b.name) + '": ' + (c.example || "—"));
      if ((c.checks || "") !== (b.checks || "")) changes.push('- "מה זה בודק" ב"' + (c.name || b.name) + '": ' + (c.checks || "—"));
    });
    state.comps.forEach(function (c) {
      if (baseComps.some(function (b) { return b.id === c.id; })) return;
      changes.push('- הצוות הוסיף: "' + (c.name || "רכיב") + '"' + (valueNames(c) ? " · ערך: " + valueNames(c) : ""));
    });
    if (changes.length) { L.push("", "### מה השתנה בלוח"); L = L.concat(changes); }
    return L.join("\n");
  }

  function toast(msg, action, fn) {
    var t = document.getElementById("toast"), b = document.getElementById("toastBtn");
    document.getElementById("toastMsg").textContent = msg;
    b.hidden = !action; b.textContent = action || "";
    b.onclick = fn ? function () { fn(); t.hidden = true; } : null;
    t.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 7000);
  }

  document.getElementById("only").addEventListener("click", function () {
    onlySel = !onlySel; this.setAttribute("aria-pressed", onlySel ? "true" : "false"); update();
  });
  document.getElementById("copy").addEventListener("click", function () {
    var text = document.getElementById("summary").textContent;
    function fallback() {
      var ok = false;
      try { var ta = el("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.append(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch (e) {}
      done(ok);
    }
    function done(ok) { if (!ok) document.getElementById("out").open = true; toast(ok ? "הסיכום הועתק — הדביקו לסוכן" : "לא הצלחתי להעתיק — הסיכום פתוח למטה"); }
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback); else fallback(); } catch (e) { fallback(); }
  });
  document.getElementById("reset").addEventListener("click", function () {
    var prev = JSON.stringify(state);
    state = fresh(); save(); render();
    toast("הלוח חזר להמלצה", "ביטול", function () { state = JSON.parse(prev); save(); render(); });
  });

  render();
})();
</script>
</body>
</html>
