<title>תרחישי השימוש</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  תבנית דף התרחישים — נשמר במיזם כ-מפרט-MVP-תרחיש.html, ליד מפרט-MVP.md, ונגזר מסעיף 4 שלו.
  הסוכן ממלא את בלוק הנתונים (id="data") ומחליף את כולו — הנתונים כאן הם דוגמה — ואת <title>: "תרחישי השימוש: <שם המיזם>". העיצוב קבוע. Light theme בלבד.
  כמה תרחישים — כל אחד רגע אחד במסע החדש, בשימוש במערכת: מה קורה, ולא הנוסח. הם נבנים אחרי טבלת הרכיבים, ולכן כאן — הקשר רכיב ← תרחיש.

  example: true רק בדוגמה · venture: שם המיזם · org: שורת המיזם (הגורם המזמין והשירות) · range: מה הדף מכסה במסע, למשל "מהשיוך למסלול ועד תיק שלם (תחנות 3–7)"
  updated: "dd.mm.yyyy" — הדף מעדכן בכל "שמירה לכולם"
  handoff: משפט — איך פונים לאדם בכל תרחיש, ומה עוד פתוח בזה ("בכל אחד מהם ... יכול לבקש לדבר עם אדם, ו... יכול להעביר ביוזמתו. איפה בדיוק ואיך, עוד פתוח.")
  links: [{ text, href }] — קישורים מלאים (https) לשאלת ה-MVP ולטבלת הרכיבים
  values: [{ id, name }] — ערכי המוצר · components: [{ id, name, value }] — הרכיבים שב-MVP בטבלת הרכיבים (בפנים / מינימלי), בשמות שלהם שם
  scenarios: לכל תרחיש, לפי הסדר במסע:
    id · title — שם התרחיש, מה קורה בו · station — איפה במסע ("תחנה 3", "תחנות 4–7") · mvp — "בפנים" / "מינימלי" / "בחוץ" (הצעה, לפי שאלת ה-MVP וטבלת הרכיבים)
    kind — "core" (הרגע שבמרכז: ההתנהגות ששאלת ה-MVP בודקת — אחד), "extension" (הרחבה שעוד לא נדונה), "ongoing" (לאורך כמה תחנות); בלי — תרחיש רגיל
    tag — תגית קצרה (רשות): "הרגע שבמרכז", "הרחבה שלא נדונה", "לאורך כל האיסוף"
    when — מתי · who — מי מול מי (הפרסונה, הסוכן, איש צוות) · steps — מה קורה, צעד אחרי צעד: מי עושה מה, AI או אדם. לא הנוסח
    field — רשות: "דוגמאות מהשטח" — ציטוט או מקרה מהמחקר · input / output — קלט ופלט, במשפט
    values — מזהי ערכים שמתבטאים כאן · components — מזהי רכיבים שמופיעים כאן · open — שאלות פתוחות: מה הסוכן החליט לבד, ומה עוד לא הוכרע
  כל רכיב שב-MVP — בתרחיש אחד לפחות. הדף מראה כמה תרחישים לכל רכיב, ומזהיר על רכיב שלא מופיע.

  עריכה ושמירה: כפתור "עריכה" נכנס למצב עריכה, ואותו כפתור — "סיום עריכה" — יוצא ממנו. בעריכה: כל שדה, ב-MVP, סוג, ערכים ורכיבים, צעדים ושאלות, הוספה, הזזה והסרה של תרחישים.
  "שמירה לכולם" מפרסמת את הדף מחדש עם הנתונים החדשים (יכולת artifact). מפרסמים עם capabilities: { artifact: {} }.
  בלי היכולת, או בלי הרשאת עריכה — העריכה נשמרת רק בדפדפן, ו"העתקת סיכום" מחזירה Markdown.
  הסוכן קורא את השמירה מהדף המפורסם (בלוק הנתונים). לפני כל פרסום מחדש מה-repo — קוראים את הגרסה החיה, כדי לא לדרוס את מה שהקבוצה שמרה.
  לשיתוף: מפרסמים כדף (Claude Artifact) מהקובץ שב-repo, ובכל עדכון לאותו קישור.
-->

  .eyebrow .draft { color: var(--brown); }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

      function mv(dir) { var j = i + dir; if (j < 0 || j >= state.scenarios.length) return; var x = state.scenarios.splice(i, 1)[0]; state.scenarios.splice(j, 0, x); changed(); render(); var r = document.getElementById("sc-" + (j + 1)); if (r) r.scrollIntoView({ block: "start" }); }
      var up = el("button", "linkbtn", "↑ לפני"); up.type = "button"; up.disabled = i === 0; up.addEventListener("click", function () { mv(-1); });
      var dn = el("button", "linkbtn", "↓ אחרי"); dn.type = "button"; dn.disabled = i === state.scenarios.length - 1; dn.addEventListener("click", function () { mv(1); });
      var rm = el("button", "linkbtn rm", "הסרת התרחיש"); rm.type = "button";
      rm.addEventListener("click", function () { var x = state.scenarios.splice(i, 1)[0]; changed(); render(); toast("\"" + (x.title || "תרחיש") + "\" הוסר", "ביטול", function () { state.scenarios.splice(i, 0, x); changed(); render(); }); });
      t.append(up, dn, rm); c.append(t);
    }
    row.append(c);
    return row;
  }

  function toggles(s, key, all, cls) {
    var box = el("div", editing ? "" : "chips");
    if (editing) {
      all.forEach(function (x) {
        var on = s[key].indexOf(x.id) !== -1;
        var b = el("button", "tog" + (key === "values" ? " v" : ""), x.name); b.type = "button"; b.setAttribute("aria-pressed", on ? "true" : "false");
        b.addEventListener("click", function () { var k = s[key].indexOf(x.id); if (k === -1) s[key].push(x.id); else s[key].splice(k, 1); b.setAttribute("aria-pressed", k === -1 ? "true" : "false"); changed(); });
        box.append(b);
      });
      if (!all.length) box.append(el("span", "none", "—"));
    } else {
      var items = s[key].map(function (id) { return byId(all, id); }).filter(Boolean);
      items.forEach(function (x) { box.append(el("span", cls, x.name)); });
      if (!items.length) box.append(el("span", "none", "—"));
    }
    return box;
  }

  function summary() {
    var L = [];
    L.push("## תרחישי השימוש — " + (state.venture || "") + " · עדכון אחרון: " + (state.updated || "—") + (dirty() ? " (עם שינויים שלא נשמרו)" : ""));
    state.scenarios.forEach(function (s, i) {
      L.push("", "### תרחיש " + (i + 1) + ": " + (s.title || "") + " · " + (s.station || "") + (s.tag ? " · " + s.tag : "") + " · MVP: " + s.mvp + (s.team ? " (הצוות)" : ""));
      L.push("**מתי:** " + (s.when || "") + " · **מי:** " + (s.who || ""));
      s.steps.forEach(function (t, j) { L.push((j + 1) + ". " + t); });
      if (s.field) L.push("", s.field);
      L.push("", "**קלט:** " + (s.input || "") + " ← **פלט:** " + (s.output || ""));
      L.push("**ערכים:** " + (s.values.map(function (id) { var v = byId(state.values, id); return v ? v.name : ""; }).filter(Boolean).join(" · ") || "—"));
      L.push("**רכיבים:** " + (s.components.map(function (id) { var c = byId(state.components, id); return c ? c.name : ""; }).filter(Boolean).join(" · ") || "—"));
      if (s.open.length) { L.push("**שאלות פתוחות:**"); s.open.forEach(function (o) { L.push("- " + o); }); }
    });
    return L.join("\n");
  }
  function copySummary() {
    var txt = summary();
    function fallback() { var d = document.getElementById("out"); d.open = true; var pre = d.querySelector("pre"); pre.textContent = txt; var rg = document.createRange(); rg.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(rg); d.scrollIntoView({ block: "center" }); toast("הסיכום מסומן למטה — Ctrl/⌘+C להעתקה."); }
    try { navigator.clipboard.writeText(txt).then(function () { toast("הסיכום הועתק. מדביקים לסוכן."); }, fallback); } catch (e) { fallback(); }
  }

  function save() {
    if (!dirty() || saving || !art) return;
    saving = true; updateBar();
    var next = clone(state); next.updated = today(); state.updated = next.updated;
    try { localStorage.setItem(DKEY, JSON.stringify({ base: hash(BASE_JSON), data: next })); } catch (e) {}
    var tries = 0;
    (function go() {
      art.publish(buildDoc(next)).then(function () {
        toast("נשמר לכולם. הדף נטען מחדש עם הגרסה החדשה.");
      }, function (e) {
        var c = (e && e.code) || "upstream_error";
        if (c === "upstream_error" && tries++ < 1) { setTimeout(go, 900 + Math.random() * 900); return; }
        saving = false;
        if (c === "conflict") { toast("מישהו שמר גרסה אחרת לפני רגע. הדף נטען מחדש — השינויים שלכם נשמרו בדפדפן, ואפשר לשחזר אותם."); return; }
        if (["not_writer", "not_granted", "consent_required", "capability_disabled", "capability_removed", "not_declared"].indexOf(c) !== -1) {
          canSave = false; notice = "אין כאן הרשאה לשמור לכולם. השינויים נשמרו בדפדפן — \"העתקת סיכום\" ושולחים למנטור הטכנולוגי.";
        } else if (c === "rate_limited") notice = "שומרים מהר מדי. נסו שוב בעוד דקה.";
        else if (c === "too_large" || c === "invalid_content" || c === "transform_error") notice = "השמירה נכשלה: הדף לא נשמר. \"העתקת סיכום\" ושולחים לסוכן.";
        else notice = "השמירה נכשלה. נסו שוב בעוד רגע.";
        state.updated = base.updated; updateBar();
      });
    })();
  }

  function toast(msg, action, fn) {
    var t = document.getElementById("toast");
    if (!t) { t = el("div", "toast"); t.id = "toast"; t.setAttribute("role", "status"); t.append(el("span"), el("button")); document.body.append(t); }
    t.firstChild.textContent = msg;
    var b = t.lastChild; b.type = "button"; b.hidden = !action; b.textContent = action || "";
    b.onclick = function () { t.hidden = true; if (fn) fn(); };
    t.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, action ? 9000 : 6000);
  }

  render();
  if (pendingDraft) {
    toast("יש לכם שינויים שלא נשמרו, ובינתיים נשמרה גרסה חדשה.", "שחזור השינויים שלי", function () { state = pendingDraft; pendingDraft = null; editing = true; render(); writeDraft(); });
  }

  function initSave() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") { canSave = false; updateBar(); return; }
    var t = setTimeout(function () { if (canSave === null) { canSave = false; updateBar(); } }, 10000);
    c.use("artifact").then(function (a) { clearTimeout(t); art = a || null; canSave = !!a; updateBar(); }, function () { clearTimeout(t); canSave = false; updateBar(); });
    try { c.use("user").then(function (u) { if (u && typeof u.canEdit === "function") u.canEdit().then(function (ok) { if (ok === false) { canSave = false; updateBar(); } }, function () {}); }, function () {}); } catch (e) {}
  }
  if (window.claude) initSave(); else if (document.readyState === "complete") setTimeout(initSave, 60); else window.addEventListener("load", function () { setTimeout(initSave, 60); });
})();
</script>
</body>
